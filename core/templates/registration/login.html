{% extends "base.html" %}
{% block title %}Log In — AutoQuant{% endblock %}

{% block content %}
<div class="page-container" style="max-width:440px;">
    <div class="glass-card">
        <h2 style="margin-bottom:1.5rem; text-align:center;">Log In</h2>

        {% if form.errors %}
            <div class="form-errors">
                <p>Invalid username or password. Please try again.</p>
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="form-input"
                       autofocus required placeholder="demo">
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" class="form-input"
                       required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
        </form>

        <p style="text-align:center; margin-top:1.25rem; font-size:0.9rem;" class="text-muted">
            Don't have an account? <a href="{% url 'signup' %}" style="color:var(--gold);">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
